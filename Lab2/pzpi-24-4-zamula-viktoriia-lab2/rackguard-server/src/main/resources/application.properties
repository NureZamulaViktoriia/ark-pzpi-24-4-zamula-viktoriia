server.port=8080
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=RackGuard;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD}
spring.servlet.multipart.max-file-size=2MB

app.data-file=./data/app-data.json
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl-hours=8
app.device.master-secret=${DEVICE_MASTER_SECRET}
app.device.skew-seconds=60
app.device.offline-seconds=120
app.qr.secret=${QR_SECRET}
app.pseudonym-secret=${PSEUDONYM_SECRET}
app.backup.directory=${BACKUP_DIR:C:/RackGuardBackups}
app.backup.master-url=jdbc:sqlserver://localhost:1433;databaseName=master;encrypt=true;trustServerCertificate=true
app.backup.database=RackGuard
app.backup.keep=7
app.admin.email=${ADMIN_EMAIL:admin@rackguard.local}
app.admin.password=${ADMIN_PASSWORD}
app.llm.api-key=${GEMINI_API_KEY:}
app.llm.model=gemini-3.8-flash
app.llm.base-url=https://generativelanguage.googleapis.com/v1beta
springdoc.swagger-ui.path=/swagger-ui.html